name: Connector release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@127.0.0.1:5432/knowledge
      REDIS_URL: redis://127.0.0.1:6379/0
      QDRANT_URL: http://127.0.0.1:6333
      S3_ENDPOINT_URL: http://127.0.0.1:8333
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
      MIGRATIONS_ON_BOOT: "false"
      LOG_JSON: "false"
      APP_ENV: test
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Start isolated fixture S3 service
        run: >-
          docker run -d --name m6-s3 -p 127.0.0.1:8333:8333
          --mount type=volume,destination=/data
          -v "$GITHUB_WORKSPACE/infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:3.82 server -dir=/data -filer -s3
      - name: Require all fixture services
        run: |
          python - <<'PY'
          import socket, time
          for port in (5432, 6379, 6333, 8333):
              for attempt in range(60):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  raise RuntimeError(f"fixture service port {port} unavailable")
          PY
      - name: Source admission and runtime regression gates
        run: >-
          pytest -q tests/unit/test_connector_config_validation.py
          tests/unit/test_local_connector_containment.py
          tests/unit/test_sync_consumer.py tests/unit/test_sync_convergence.py
          tests/unit/test_sync_deletion.py tests/integration/test_sources.py
          tests/integration/test_sync_worker_production.py
          tests/integration/test_connector_migrations.py
          tests/integration/test_sync_adapters_live.py
          --junitxml=connector-release.xml
      - name: Require executed acceptance checks
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("connector-release.xml").getroot()
          cases = root.findall(".//testcase")
          assert cases, "no connector tests executed"
          skipped = [case.attrib.get("name") for case in cases if case.find("skipped") is not None]
          assert not skipped, f"connector acceptance skipped: {skipped}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-release-${{ github.sha }}
          path: connector-release.xml
          if-no-files-found: error
      - name: Fixture service diagnostics
        if: failure()
        run: docker logs --tail 50 m6-s3
