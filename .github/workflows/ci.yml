name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    # Same images as docker-compose.yml. Tests read the localhost defaults in
    # packages/core/config.py (user/password/db = knowledge, ports 5432/6379).
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@localhost:5432/knowledge
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same OCR packages as apps/worker/Dockerfile; tests/unit/test_ocr_adapters.py
      # skips its end-to-end OCR cases when the binary or font is missing.
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-ron tesseract-ocr-por fonts-dejavu-core

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Install CPU reranker test dependencies
        run: >-
          pip install -r apps/rerank/requirements.txt
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple

      - name: Ruff lint
        run: ruff check .

      - name: Mypy typecheck
        run: mypy

      - name: Vendor SDK import guard (must stay inside adapters/)
        run: |
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+(qdrant_client|redis|psycopg|psycopg2|minio|boto3|pypdf|pdfplumber|docx|bs4|llama_index|haystack|openai|sentence_transformers|transformers|httpx)" --include='*.py' apps packages \
             | grep -vE "/adapters/"; then
            echo "::error::Vendor SDK imported outside an adapters/ package"
            exit 1
          fi
          echo "Vendor isolation OK"

      - name: Authorization guard (role checks only in app/authz/)
        run: |
          if grep -rnE "if[^\n]*\.role[[:space:]]*(==|!=|in[[:space:]])" --include='*.py' apps/api/app \
             | grep -vE "app/authz/"; then
            echo "::error::role check outside app/authz/ — use authz.can()/require()"
            exit 1
          fi
          echo "Authorization isolation OK"

      - name: Apply database migrations
        working-directory: apps/api
        env:
          PYTHONPATH: ../../packages
        run: alembic upgrade head

      # Postgres and Redis are real here; Qdrant, SeaweedFS, the API and the web app are not.
      # tests/integration needs the full compose stack, and once it sees Postgres/Redis it
      # stops skipping and fails (and its app-boot side effects break later unit tests),
      # so it runs on its own below, as before, with those two services hidden from it.
      - name: Pytest (unit + contract)
        env:
          MIGRATIONS_ON_BOOT: "false"
          LOG_JSON: "false"
        run: pytest -q --ignore=tests/integration

      - name: Pytest (integration, self-skips without the compose stack)
        env:
          MIGRATIONS_ON_BOOT: "false"
          LOG_JSON: "false"
          DATABASE_URL: postgresql+psycopg://knowledge:knowledge@127.0.0.1:1/knowledge
          REDIS_URL: redis://127.0.0.1:1/0
        run: pytest -q tests/integration

  worker-import:
    name: worker import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: pip install -r apps/worker/requirements.txt
      - name: Import worker entrypoint
        env:
          PYTHONPATH: "packages:apps/worker"
        run: python -c "import worker.main; import worker.adapters.redis_broker"
  model-origin-guard:
    name: Model origin guard (policy PD-005 v3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the required dotenv parser
        run: python -m pip install python-dotenv==1.2.4

      - name: Model origin allowlist gate
        run: |
          bash scripts/model_origin_guard.sh
          bash scripts/model_origin_guard.sh --selftest

  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check web app present
        id: web
        run: echo "present=$([ -f apps/web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.web.outputs.present == 'yes'
        working-directory: apps/web
        run: npm ci
      - name: Lint
        if: steps.web.outputs.present == 'yes'
        working-directory: apps/web
        run: npm run lint
      - name: Require Chrome for browser regression tests
        if: steps.web.outputs.present == 'yes'
        working-directory: apps/web
        run: |
          CHROME_BINARY="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BINARY"
          echo "CHROME_PATH=$CHROME_BINARY" >> "$GITHUB_ENV"
      - name: Run browser and unit tests
        if: steps.web.outputs.present == 'yes'
        working-directory: apps/web
        run: npm run test -- --maxWorkers=2 --minWorkers=1
      - name: Build
        if: steps.web.outputs.present == 'yes'
        working-directory: apps/web
        run: npm run build
