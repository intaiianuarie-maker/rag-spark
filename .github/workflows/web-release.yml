name: Web release artifact

on:
  push:
    branches: [review/super-rag-2026-10-17]
    paths:
      - apps/web/**
      - .github/workflows/web-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Next uses this to select one page-generation worker.
      CIRCLE_NODE_TOTAL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test -- --maxWorkers=2 --minWorkers=1
      - run: npm run build -- --webpack
      - name: Package standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/source-revision.txt
          tar -czf web-release.tar.gz -C .next/standalone .
          sha256sum web-release.tar.gz > web-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: |
            apps/web/web-release.tar.gz
            apps/web/web-release.sha256
          retention-days: 7
          if-no-files-found: error
