name: Live release acceptance

on:
  workflow_dispatch:
  push:
    branches: [review/super-rag-2026-10-17]
    paths:
      - .github/workflows/live-release.yml
      - tests/fixtures/scripts/live_release_stack.py
      - tests/fixtures/scripts/release_journey*

permissions:
  contents: read

concurrency:
  group: live-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-release:
    if: github.ref == 'refs/heads/review/super-rag-2026-10-17'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@127.0.0.1:5432/knowledge
      REDIS_URL: redis://127.0.0.1:6379/0
      QDRANT_URL: http://127.0.0.1:6333
      S3_ENDPOINT_URL: http://127.0.0.1:8333
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
      API_BASE_URL: http://127.0.0.1:8000
      BASE_URL: http://127.0.0.1:3001
      APP_ENV: ci
      MIGRATIONS_ON_BOOT: "false"
      LOG_JSON: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CIRCLE_NODE_TOTAL: "2"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install actual API and worker dependencies
        run: pip install -r apps/api/requirements.txt -r apps/worker/requirements.txt
      - name: Install isolated browser driver
        run: >-
          npm install --prefix "$RUNNER_TEMP/live-release-qa"
          --no-save --package-lock=false --no-fund playwright@1.62.1
      - name: Require preinstalled Chrome
        run: |
          CHROME_BINARY="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BINARY"
          echo "CHROME_PATH=$CHROME_BINARY" >> "$GITHUB_ENV"
      - name: Build actual Next standalone release
        working-directory: apps/web
        run: |
          npm ci --no-fund
          npm run build -- --webpack
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
      - name: Start authenticated ephemeral S3 fixture
        run: >-
          docker run -d --name live-release-s3 -p 127.0.0.1:8333:8333
          --mount type=volume,destination=/data
          -v "$GITHUB_WORKSPACE/infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:3.82 server -dir=/data -filer -s3
          -s3.config=/etc/seaweedfs/s3.json
      - name: Run actual authenticated release journey
        timeout-minutes: 25
        env:
          # Scoped to this step; never available during install/build or artifacts.
          OPENROUTER_API_KEY: ${{ secrets.SUPER_RAG_RELEASE_OPENROUTER_API_KEY }}
          ANSWER_MODEL: google/gemma-4-26b-a4b-it:free
          RERANK_ENABLED: "true"
          LIVE_RELEASE_EPHEMERAL: "1"
        run: >-
          python tests/fixtures/scripts/live_release_stack.py
          --report-dir "$RUNNER_TEMP/live-release-reports"
      - name: Upload safe acceptance summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-release-${{ github.sha }}
          path: ${{ runner.temp }}/live-release-reports/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral S3 fixture
        if: always()
        run: docker rm -f -v live-release-s3 >/dev/null 2>&1 || true
