# Knowledge OS — local development stack.
#
#   docker compose up -d --build
#
# Starts: web (Next.js), api (FastAPI), worker, postgres, redis, qdrant, seaweedfs (optional, PD-005).
# All settings have defaults; copy .env.example to .env to override.
#
# ============================================================================
# NETWORK SURFACE — T-V1-037 (2026-10-12). Every port this project publishes,
# why it exists, and what `ss -tlnp` must show after a full recreate.
# Backing services are loopback-only: 0 off-box reachable backing ports.
# ----------------------------------------------------------------------------
# LOOPBACK-ONLY (127.0.0.1) — backing services, never reachable off-box:
#   postgres   127.0.0.1:5432     metadata + lexical FTS (PD-002)
#   redis      127.0.0.1:6379     ingest queue / cache (M2-001c)
#   qdrant     127.0.0.1:6333     vectors, HTTP API
#              127.0.0.1:6334     vectors, gRPC
#   seaweedfs  127.0.0.1:8333     S3 object store (PD-005). Its other exposed
#                                 ports (7333/8080/8888/9333/…) are container
#                                 internal only — no host publish, so no `ss` line.
#   infinity   127.0.0.1:7997     embeddings + rerank model server.
#                                 CLOSES the public :7997 finding (review
#                                 2026-10-09 finding-01): no host client needs it.
#                                 api/worker reach it over the compose network at
#                                 http://infinity-rerank:7997 (service DNS), which
#                                 bypasses the docker-proxy host binding entirely;
#                                 loopback is kept only so host-local debugging
#                                 (`curl localhost:7997/...`) still works.
#                                 -> If a model server must ever be shared across
#                                 boxes, that is an explicit decision in DECISIONS.md,
#                                not a default port publish.
# The host-side IP above never affects container-to-container traffic: services
# talk on the compose network by service name, so loopback binds cost nothing.
#
# PUBLIC (0.0.0.0) — justified, one line each (ticket asks justify-or-remove):
#   ${WEB_PORT:-3001}  -> :3000   web (Next.js) UI. Browser entry point: the ONLY
#                                 port a human/browser agent needs to open.
#                                 Same-origin /api/* proxy means the browser never
#                                 touches :8000 directly. Justified: keep.
#   ${API_PORT:-8000}  -> :8000   api (FastAPI). Published for HOST-LOCAL tooling
#                                 only — `curl /health` + `/ready`, test suites,
#                                 IDE/debug on this box. In-stack consumers use
#                                 http://api:8000 (web) and the compose network.
#                                 It is the product HTTP API, not a backing store:
#                                 JWT-authenticated (AUTH_JWT_SECRET), CORS locked
#                                 to CORS_ORIGINS (default http://localhost:3001).
#                                 Justified: keep. Hardening option, if no remote
#                                 host tooling is ever needed: prefix it with
#                                 127.0.0.1 exactly like the backing services.
#
# NOT PUBLISHED BY THIS STACK — accounted for so the audit is complete:
#   :80 / :443   owned by the HOST nginx reverse proxy (systemd, outside this
#                compose project — `ss -tlnp` shows the `nginx` process, not
#                `docker-proxy`). This stack serves plain HTTP behind it and
#                terminates TLS at that proxy (COOKIE_SECURE=true when it does).
#                Nothing to remove here; do not add 80/443 publishes to this file.
#   :22          host sshd. Also not ours.
#
# EXPECTED `ss -tlnp` (grep docker-proxy) AFTER COORDINATOR REDEPLOY:
#   127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:6333 127.0.0.1:6334
#   127.0.0.1:8333 127.0.0.1:7997           <- loopback (backing + model server)
#   0.0.0.0:3001 0.0.0.0:8000 (+ their [::] twins)  <- public, justified above
#   no 0.0.0.0:5432/6379/6333/6334/8333/7997       <- 0 off-box backing ports
#   no :80, :443 from docker (host nginx owns both)
# DEPLOY NOTE (not a code gap): a container created BEFORE a loopback fix keeps
# its old 0.0.0.0 binding until it is recreated — `docker compose up -d` with
# this file already declares 127.0.0.1 for all six backing/model ports, so the
# ss state above appears only after the coordinator's redeploy. Nothing is
# restarted from this ticket (coordinator owns deploys).
# ============================================================================

name: knowledge-os

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-knowledge}@postgres:5432/${POSTGRES_DB:-knowledge}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
  S3_BUCKET: ${S3_BUCKET:-knowledge-os}
  # T-V1-043 (2026-10-13 museR): DONE — BAAI/bge-m3 (1024-d) now served on the
  # infinity-rerank model server alongside the reranker, so strict dimension
  # enforcement is restored. Adapting/padding vectors to fit a collection is a
  # manufactured vector (T-V1-015 boundary, review1 F5) and must stay off; the
  # opt-in above existed only while the served model was 384-d bge-small.
  ALLOW_DIMENSION_ADAPTATION: ${ALLOW_DIMENSION_ADAPTATION:-false}
  # PD-005 (2026-10-08): object storage is SeaweedFS (Apache-2.0), NOT MinIO.
  # The AGPLv3 MinIO community repackage is retired; compose now provides
  # SeaweedFS (optional external service) only. Adapter-only S3 access uses
  # S3 access (`packages/storage/adapters/seaweedfs_s3.py`, boto3 SDK permitted inside adapters/, zero SDK outside).
  # One-command backend swap: set SEAWEEDFS_ENDPOINT and override adapter endpoint.
  SEAWEEDFS_ENDPOINT: ${SEAWEEDFS_ENDPOINT:-http://seaweedfs:8333}
  SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-admin}
  SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-admin}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://seaweedfs:8333}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  LITELLM_URL: ${LITELLM_URL:-https://openrouter.ai/api/v1}
  ANSWER_MODEL: ${ANSWER_MODEL:-nvidia/nemotron-3.5-lightning:free}
  INFINITY_URL: ${INFINITY_URL:-http://infinity-rerank:7997}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-1.5}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
  # Chunking backend (TASK-M2-002): llamaindex (default) | builtin.
  CHUNKING_BACKEND: ${CHUNKING_BACKEND:-llamaindex}

services:
  postgres:
    image: postgres:16.15-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      # T-V1-037: loopback only — no off-box reach to the primary datastore.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # T-V1-037: loopback only — the ingest queue must never be reachable off-box.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      # T-V1-037: loopback only (HTTP + gRPC) — vector store stays off-box-invisible.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  seaweedfs:
    # PD-005 (2026-10-08): object storage is SeaweedFS (Apache-2.0), NOT MinIO.
    # Optional external service; adapter-only S3 access via boto3 behind seam.
    # Image unmodified; one-command backend swap = change endpoint URL.
    image: chrislusf/seaweedfs:3.82
    command: ["server", "-dir=/data", "-filer", "-s3"]
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-admin}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-admin}
    ports:
      # T-V1-037: loopback only — S3 object store (document originals) is a
      # backing service. The image also EXPOSEs 7333/8080/8888/9333/…, but those
      # are container-internal: no host publish, so they never appear in `ss -tln`.
      - "127.0.0.1:${SEAWEEDFS_PORT:-8333}:8333"
    volumes:
      - weedfsdata:/data
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      MIGRATIONS_ON_BOOT: ${MIGRATIONS_ON_BOOT:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    ports:
      # T-V1-037 PUBLIC (justified): host-local tooling only (curl /health +
      # /ready, test suites, IDE). In-stack callers use http://api:8000 over the
      # compose network. It is the authenticated product API (JWT + CORS_ORIGINS),
      # not a backing store — no backing port is reachable off-box.
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      seaweedfs:
        condition: service_started
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages

  web:
    # Frontend shell owned by code2 (apps/web). Uses the app's production
    # Dockerfile (Next.js standalone output). API_BASE_URL is a server-side var
    # read by the /api/health proxy route, so the browser stays same-origin.
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # T-V1-037 PUBLIC (justified): browser entry point — the single port a
      # human/browser agent opens. Host default 3001: :3000 is a common dev port
      # and is frequently occupied in this workspace; WEB_PORT stays overridable
      # per host. The browser only ever talks same-origin here (see /api proxy).
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api


  infinity-rerank:
    # T-V1-060 incident: :latest drifted under us to 0.0.77, whose CLI REQUIRES
    # an explicit subcommand (bare `infinity_emb` exits 0 with "No command
    # given... use the v2 command") — 25 silent restarts, /ready infinity=false,
    # ingest down stack-wide. PINNED to the version we validated + explicit
    # command. Never float this back to :latest without re-validating.
    image: michaelf34/infinity:0.0.77
    command: ["v2", "--host", "0.0.0.0", "--port", "7997"]
    restart: unless-stopped
    environment:
      # T-V1-043: bge-m3 (1024-d, MIT) is THE embedding model — collections are
      # 1024-d and the adapter pins BAAI/bge-m3 / 1024 by default. The reranker
      # stays on the same server (multi-model); INFINITY_URL is unchanged.
      # NB: this image (michaelf34/infinity:latest) reads INFINITY_MODEL_ID /
      # INFINITY_ENGINE — the legacy INFERENCE_* names are silently ignored and
      # the default bge-small loads instead (caught in T-V1-043 recon). The
      # engine enum here is torch|ctranslate2|optimum|neuron (no 'onnx'), and
      # multi-model lists are SEMICOLON-separated (a comma is kept as one id).
      INFINITY_MODEL_ID: BAAI/bge-m3;cross-encoder/ms-marco-MiniLM-L6-v2
      INFINITY_ENGINE: torch
      PORT: "7997"
    ports:
      # T-V1-037 — CLOSING the public infinity question (review 2026-10-09
      # finding-01; V1-COMPLETION-PLAN §2 item 1). Not public, not justified
      # public: api/worker reach this model server over the compose network at
      # http://infinity-rerank:7997 (see INFINITY_URL above), which never touches
      # the host proxy, so a public publish buys nothing and exposes an
      # unauthenticated model server off-box. 127.0.0.1 keeps host-local debug
      # only. Reversible only via an explicit DECISIONS.md row, never by default.
      - "127.0.0.1:7997:7997"

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  weedfsdata:
